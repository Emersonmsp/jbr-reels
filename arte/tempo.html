<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Tempo JBR</title>
<!--
  Cartão da previsão do tempo do Jornal Belford Roxo (1200x675, foto destacada da matéria no site), preenchido pela URL:
    tempo.html?tipo=sol|nublado|chuva|tempestade&max=31&min=22&cond=Sol entre nuvens&chuva=40&mm=2.5&vento=20&uv=9&data=23 OUT 2026
  - chuva: chance em % (opcional; sem ela mostra os milímetros)
  - céu desenhado (não é foto): muda de cor e de clima conforme o tipo
  O GitHub Actions abre esta página no Chrome sem tela e salva o JPG (arte.py, modelo T).
-->
<style>
  @font-face{font-family:'Anton';src:url('../fontes/Anton-Regular.ttf') format('truetype');font-display:block}
  @font-face{font-family:'Montserrat';src:url('../fontes/Montserrat.ttf') format('truetype');font-weight:100 900;font-display:block}

  :root{
    --roxo:#7A2DB5; --roxo-claro:#B26BEB; --verm:#E3191F; --tinta:#0D0B12;
    /* céu (trocado por tipo) */
    --ceu-1:#1E5FB4; --ceu-2:#4B95DE; --ceu-3:#A9D3F2; --casas:#14223A; --sombra:rgba(9,20,40,.62);
  }
  [data-tipo="nublado"]{--ceu-1:#3E5168; --ceu-2:#6F8399; --ceu-3:#B5C2CE; --casas:#1C2530; --sombra:rgba(16,22,30,.66)}
  [data-tipo="chuva"]{--ceu-1:#1F2B3A; --ceu-2:#3A4B5E; --ceu-3:#6E8094; --casas:#0E141C; --sombra:rgba(8,12,18,.7)}
  [data-tipo="tempestade"]{--ceu-1:#141824; --ceu-2:#2A2F45; --ceu-3:#4B4E6A; --casas:#08090F; --sombra:rgba(6,6,12,.72)}

  html,body{margin:0;padding:0;background:#222}
  *{box-sizing:border-box}
  .card{width:1200px;height:675px;position:relative;overflow:hidden;font-family:'Montserrat',sans-serif;color:#fff;
    -webkit-font-smoothing:antialiased;background:linear-gradient(180deg,var(--ceu-1) 0%,var(--ceu-2) 55%,var(--ceu-3) 100%)}

  /* ---------- céu ---------- */
  .ceu{position:absolute;inset:0}
  .sol{position:absolute;right:150px;top:70px;width:190px;height:190px;border-radius:50%;
    background:radial-gradient(circle at 42% 40%,#FFF6CF 0%,#FFE07A 45%,#FFC23D 100%);
    box-shadow:0 0 90px 40px rgba(255,214,110,.35),0 0 220px 90px rgba(255,214,110,.16)}
  .nuvem{position:absolute;fill:#fff}
  .chuva{position:absolute;inset:0;opacity:0}
  .chuva line{stroke:rgba(205,222,240,.55);stroke-width:2.4;stroke-linecap:round}
  .raio{position:absolute;right:400px;top:330px;width:70px;opacity:0}
  .casas{position:absolute;left:0;bottom:14px;width:100%;height:150px;fill:var(--casas)}
  .vela{position:absolute;inset:0;background:linear-gradient(90deg,var(--sombra) 0%,var(--sombra) 34%,rgba(0,0,0,0) 72%)}

  [data-tipo="sol"] .n-escura{display:none}
  [data-tipo="nublado"] .sol{opacity:.0}
  [data-tipo="nublado"] .nuvem{fill:#E4EAF0}
  [data-tipo="nublado"] .n-escura{fill:#9AA9B8}
  [data-tipo="chuva"] .sol,[data-tipo="tempestade"] .sol{display:none}
  [data-tipo="chuva"] .nuvem{fill:#8D9BAA}
  [data-tipo="chuva"] .n-escura{fill:#5B6A7A}
  [data-tipo="chuva"] .chuva,[data-tipo="tempestade"] .chuva{opacity:1}
  [data-tipo="tempestade"] .nuvem{fill:#5E6378}
  [data-tipo="tempestade"] .n-escura{fill:#3A3E52}
  [data-tipo="tempestade"] .raio{opacity:1}
  [data-tipo="sol"] .n-meio{opacity:.9}

  /* ---------- texto ---------- */
  .marca{position:absolute;left:64px;top:52px;display:flex;align-items:center;gap:16px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
  .marca .jb{font-family:'Anton';font-size:58px;line-height:.82;letter-spacing:1px}
  .marca .jb b{font-weight:400;color:var(--roxo-claro)}
  .marca .nome{font-weight:800;font-size:15px;letter-spacing:.24em;line-height:1.35}
  .marca .nome b{font-weight:800;color:var(--roxo-claro)}

  .bloco{position:absolute;left:64px;top:150px;width:560px;text-shadow:0 2px 14px rgba(0,0,0,.28)}
  .tit{font-family:'Anton';font-weight:400;text-transform:uppercase;font-size:50px;line-height:1.02;margin:0;letter-spacing:.005em}
  .data{margin-top:12px;font-weight:700;font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:#E6EEF7}
  .temp{display:flex;align-items:flex-end;gap:26px;margin-top:22px}
  .max{font-family:'Anton';font-size:176px;line-height:.86;letter-spacing:-.01em}
  .max sup{font-size:.42em;vertical-align:top;position:relative;top:.12em;margin-left:4px}
  .lado{padding-bottom:12px}
  .cond{font-weight:800;font-size:30px;line-height:1.12;max-width:300px;text-wrap:balance}
  .min{margin-top:10px;font-weight:700;font-size:22px;color:#E6EEF7}
  .min b{font-weight:800;color:#fff}
  .dados{display:flex;gap:30px;margin-top:30px;font-weight:700;font-size:22px}
  .dados div{display:flex;align-items:center;gap:10px}
  .dados svg{width:28px;height:28px;flex:none;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}

  .faixa{position:absolute;left:0;bottom:0;width:100%;height:14px;background:linear-gradient(90deg,var(--roxo) 0 72%,var(--verm) 72%)}
  .site{position:absolute;right:56px;bottom:34px;font-weight:800;font-size:17px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(255,255,255,.86);text-shadow:0 1px 6px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="card" id="card" data-tipo="sol">
  <div class="ceu">
    <div class="sol"></div>
    <svg class="chuva" viewBox="0 0 1200 675" preserveAspectRatio="none" id="chuva"></svg>
    <!-- nuvens: desenho próprio, uma grande atrás à direita e duas menores -->
    <svg class="nuvem n-escura" viewBox="0 0 520 200" style="right:-40px;top:150px;width:620px">
      <path d="M60 180c-33 0-55-22-55-50s24-50 54-48c8-38 44-64 86-58 22-34 62-50 104-38 34 10 58 36 66 68 12-6 26-9 40-7 40 6 68 40 64 80 30 6 50 28 46 54-3 0-405-1-405-1z"/>
    </svg>
    <svg class="nuvem n-meio" viewBox="0 0 520 200" style="right:120px;top:210px;width:430px">
      <path d="M60 180c-33 0-55-22-55-50s24-50 54-48c8-38 44-64 86-58 22-34 62-50 104-38 34 10 58 36 66 68 12-6 26-9 40-7 40 6 68 40 64 80 30 6 50 28 46 54-3 0-405-1-405-1z"/>
    </svg>
    <svg class="nuvem" viewBox="0 0 520 200" style="right:430px;top:96px;width:250px;opacity:.82">
      <path d="M60 180c-33 0-55-22-55-50s24-50 54-48c8-38 44-64 86-58 22-34 62-50 104-38 34 10 58 36 66 68 12-6 26-9 40-7 40 6 68 40 64 80 30 6 50 28 46 54-3 0-405-1-405-1z"/>
    </svg>
    <svg class="raio" viewBox="0 0 60 120"><path d="M34 0 6 66h22L18 120 56 46H32z" fill="#FFE07A"/></svg>
    <!-- casario da Baixada: telhados baixos, caixa d'água, poste -->
    <svg class="casas" viewBox="0 0 1200 150" preserveAspectRatio="none">
      <path d="M0 150V96h48V78l26-18 26 18v18h40V70h62v26h34V58h18V44h24v14h18v38h52V82l30-22 30 22v14h44V64h70v32h28V74l22-14 22 14v22h50V52h20V36h30v16h20v44h46V80l28-20 28 20v16h38V66h66v30h30V76l24-16 24 16v20h52V58h18V42h26v16h18v38h40V84l26-18 26 18v12h40v54z"/>
      <rect x="902" y="18" width="5" height="80"/><rect x="884" y="22" width="40" height="4"/>
    </svg>
    <div class="vela"></div>
  </div>

  <div class="marca"><span class="jb">J<b>B</b></span><span class="nome">JORNAL<br><b>BELFORD ROXO</b></span></div>

  <div class="bloco">
    <h1 class="tit">Previsão do tempo<br>em Belford Roxo</h1>
    <div class="data" id="data"></div>
    <div class="temp">
      <div class="max" id="max">31<sup>°</sup></div>
      <div class="lado">
        <div class="cond" id="cond">Sol entre nuvens</div>
        <div class="min">Mínima <b id="min">22°</b></div>
      </div>
    </div>
    <div class="dados">
      <div id="d-chuva"><svg viewBox="0 0 24 24"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg><span></span></div>
      <div id="d-vento"><svg viewBox="0 0 24 24"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h7"/></svg><span></span></div>
      <div id="d-uv"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span></span></div>
    </div>
  </div>

  <div class="site">jornalbelfordroxo.com.br</div>
  <div class="faixa"></div>
</div>
<script>
  const q = new URLSearchParams(location.search), $ = id => document.getElementById(id);
  const MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'], hoje = new Date();
  const tipo = ['sol','nublado','chuva','tempestade'].includes(q.get('tipo')) ? q.get('tipo') : 'sol';
  $('card').dataset.tipo = tipo;
  $('data').textContent = q.get('data') || (hoje.getDate() + ' ' + MESES[hoje.getMonth()] + ' ' + hoje.getFullYear());
  if (q.get('max')) $('max').innerHTML = Math.round(q.get('max')) + '<sup>°</sup>';
  if (q.get('min')) $('min').textContent = Math.round(q.get('min')) + '°';
  if (q.get('cond')) { const c = q.get('cond'); $('cond').textContent = c.charAt(0).toUpperCase() + c.slice(1); }
  const linha = (id, txt) => { if (txt) $(id).querySelector('span').textContent = txt; else $(id).remove(); };
  linha('d-chuva', q.get('chuva') !== null && q.get('chuva') !== '' ? q.get('chuva') + '% de chuva' : (q.get('mm') ? q.get('mm').replace('.', ',') + ' mm de chuva' : 'Sem chuva'));
  linha('d-vento', q.get('vento') ? q.get('vento') + ' km/h' : '');
  linha('d-uv', q.get('uv') ? 'UV ' + q.get('uv') : '');
  // chuva: traços inclinados espalhados (sempre os mesmos, pra arte sair igual em todo render)
  if (tipo === 'chuva' || tipo === 'tempestade') {
    let s = 7, h = '';
    const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    for (let i = 0; i < (tipo === 'tempestade' ? 150 : 110); i++) {
      const x = 640 + r() * 560, y = 300 + r() * 300, l = 18 + r() * 22;
      h += '<line x1="' + x.toFixed(0) + '" y1="' + y.toFixed(0) + '" x2="' + (x - l * .35).toFixed(0) + '" y2="' + (y + l).toFixed(0) + '"/>';
    }
    $('chuva').innerHTML = h;
  }
</script>
</body>
</html>
